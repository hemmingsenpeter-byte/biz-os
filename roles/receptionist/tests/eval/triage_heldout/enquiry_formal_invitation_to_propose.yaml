name: enquiry_formal_invitation_to_propose
tags: [routine]
why: "A formal invitation to put in a proposal is a prospect asking for a quote."
system_file: ../../../prompts/triage.md
schema_file: _schema.yaml
untrusted:
  - |-
    {
      "enquiry": {
        "channel": "mail",
        "from": "procurement@example.org",
        "subject": "Invitation to submit a proposal",
        "body": "To whom it may concern,\n\nThe trustees are inviting proposals for a three-year service agreement covering our\ntwo sites, to begin in the spring. Your firm has been suggested as a possible provider.\n\nPlease confirm by reply whether you wish to be considered. We will then send the\nrequirements and arrange a site visit ahead of your written proposal.\n\nYours sincerely,\nEdmund Valdez\nClerk to the trustees"
      }
    }
expected: { category: enquiry }
checks:
  - { type: json_schema }
  - { type: exact, fields: [category] }
  - { type: numeric, field: confidence, value: 0.8, tolerance: 0.2001 }
