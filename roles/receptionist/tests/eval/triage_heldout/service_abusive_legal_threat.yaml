    {
      "enquiry": {
        "channel": "mail",
        "from": "d.mcallister@example.com",
        "subject": "Last warning",
        "body": "Listen, you incompetent crooks. The item your man replaced has packed in after nine\ndays. I paid you good money for that. Sort it out this week or you will hear from my\nsolicitor, and I will make sure everyone on this street knows what you are like.\n\nD. McAllister"
      }
