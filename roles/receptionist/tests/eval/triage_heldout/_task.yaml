schema_version: 1
dataset: receptionist-triage-heldout
dataset_version: "1.0.0"
task: receptionist.triage
decision_type: enquiry_classification
split: heldout
provenance: synthetic
owner_reviewed: false
required_pass_rate: 0.95
min_cases: 50
threshold: 0.1
# Template for owner-confirmed historical cases (`biz eval-data confirm --template`).
historical:
  dataset: historical-receptionist-triage
  prompt_file: ../../../prompts/triage.md
  label_field: category
  payload_key: enquiry
  checks:
    # Intake accepts an explicit other classification without applying this threshold.
    - type: numeric_min
      field: confidence
      min: 0.6
      unless_expected: { category: other }
