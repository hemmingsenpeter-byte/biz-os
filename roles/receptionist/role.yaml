role: receptionist
version: 1.0.0
requires: { kernel: ">=1.0,<2", capabilities: [intake, booking] }
mission: Answer every call, form and email quickly, route each enquiry to the right place, and offer meeting times.
goals: [enquiry_response_minutes]
heartbeat: { cadence: 5m, triggers: [enquiry.received, opportunity.qualified] }
budget_usd_month: 10
topics:
  - name: missed_call_text_back
    sop: sops/missed_call_text_back.yaml
    tools: [intake.create_enquiry, intake.text_back]
  - name: triage
    sop: sops/triage.yaml
    tools: [intake.classify, intake.set_classification]
  - name: book_meeting
    sop: sops/book_meeting.yaml
    tools: [intake.read_enquiry, booking.offer_slots, intake.reply, booking.book]
sources: [business, "role:receptionist"]
consumes: [enquiry.received, opportunity.qualified]
publishes: [message.sent, opportunity.qualified, service_request.received, enquiry.declined, meeting.booked]
evidence:
  text_back: ["packet:message.sent"]
  triage: ["triage.routed"]
  book_meeting: ["packet:meeting.booked"]
autonomy_defaults: { missed_call_text_back: 2, meeting_offer_sending: 2, meeting_booking: 2 }
model_tier: { triage: local, book_meeting: local }
escalate_when: [confidence_below: 0.6]
slots: [industry.text_back_template]
