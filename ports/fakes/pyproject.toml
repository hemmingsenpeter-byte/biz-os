[project]
name = "biz-port-fakes"
version = "1.0.0"
description = "Fake implementations of every BIZ OS port, used by apps/demo and tests"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_port_fakes"]
