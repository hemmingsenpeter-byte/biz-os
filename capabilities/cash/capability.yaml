name: cash
version: 1.0.0
requires: { kernel: ">=1.0,<2", ports: [accounting] }
tools:
  - { name: cash.bank_balance, side_effect: read, description: "Bank balance from the accounting system, to open the forecast with" }
  - { name: cash.forecast, side_effect: read, description: "Week-by-week cash forecast from receivables and payables; flags a floor breach" }
publishes: []
consumes: []
screens: []
signals: [cash_below_floor]
