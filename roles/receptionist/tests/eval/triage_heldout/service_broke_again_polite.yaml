    {
      "enquiry": {
        "channel": "mail",
        "from": "naomi.fitzgerald@example.com",
        "subject": "Fault has come back",
        "body": "Hello,\n\nThank you for coming out last week. Unfortunately the fault has returned, with the\nsame symptoms as before, starting about two days after the repair. Could you arrange\na return visit? I assume this is covered since it is the same issue.\n\nNaomi Fitzgerald"
      }
    }
expected: { category: service_request }
checks:
