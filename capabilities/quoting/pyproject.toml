[project]
name = "biz-cap-quoting"
version = "1.0.0"
description = "Briefs, scopes, price book, estimates, proposals, variations"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_cap_quoting"]
