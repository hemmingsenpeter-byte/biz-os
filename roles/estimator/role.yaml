role: estimator
version: 1.0.0
requires: { kernel: ">=1.0,<2", capabilities: [quoting, documents] }
mission: Turn confirmed briefs into accurate, profitable scopes and estimates.
goals: [quote_turnaround_hours, estimate_accuracy_pct, win_rate_pct]
heartbeat: { cadence: 30m, triggers: [brief.confirmed, survey.completed, variation.raised] }
budget_usd_month: 40
topics:
  - name: scope_writing
    sop: sops/scope_writing.yaml
    tools: [quoting.scope_write, documents.render]
  - name: pricing
    sop: sops/pricing.yaml
    tools: [quoting.price_book_read, quoting.estimate_write, quoting.estimate_check, documents.render]
  - name: variation_pricing
    sop: sops/variation_pricing.yaml
    tools: [quoting.price_book_read, quoting.variation_price]
sources: [business, "job:*", "role:estimator"]
consumes: [brief.confirmed, survey.completed, scope.approved, variation.raised]
publishes: [scope.approved, estimate.ready, variation.priced, escalation.raised]
evidence:
  scope_writing: ["packet:scope.approved", "approval.granted"]
  pricing: ["approval.granted", "packet:estimate.ready"]
  variation_pricing: ["approval.granted", "packet:variation.priced"]
autonomy_defaults: { scope_writing: 2, pricing: 2, variation_pricing: 2 }
model_tier: { scope_writing: cloud, pricing: cloud, variation_pricing: local }
escalate_when:
  - confidence_below: 0.7
  - margin_below_policy
  - unknown_trade_item
slots:
  - industry.scope_template
  - industry.price_book_categories
  - industry.proposal_template
