# M0 placeholder; real parts arrive M2+.
objective: >-
  HIVE: a commercial fit-out business. Win and deliver office fit-out projects profitably,
  with the owner approving anything that sends, pays or signs.
notes:
  - Nothing leaves the company without a named approver.
authority:
  default: owner
limits:
  max_amount: { default: 0 }   # no money actions at M0
  over_limit: deny
  # owner to set before money actions go live (M6): a business-wide total per local day
  # max_daily: { default: 0 }
  day_timezone: Pacific/Auckland
hard_rules:
  deny_tools: []
  deny_decision_types: []
autonomy:
  default: 2
  reply_drafting: 2
  reply_sending: 2
  # owner to decide: raise to 3 for instant text-back (sends need the owner's decision)
  missed_call_text_back: 2
  meeting_offer_sending: 2
  meeting_booking: 2
  invoice_posting: 2       # the owner approves every invoice before it is posted to Xero
  bill_posting: 2             # the owner approves every bill before it is posted
  debtor_reminder_sending: 2  # the owner approves every payment reminder
comms:               # deterministic send gate (capabilities/comms)
  banned_phrases: []    # case-insensitive phrases that block a message
  link_domains: []      # add the business's own domain
quoting:
  # owner to set: placeholder margins and currency
  min_margin_pct: 15
  target_margin_pct: 25
  max_discount_pct: 5
  currency: NZD
invoicing:
  payment_terms_days: 20
  reminder_days: [7, 14, 30]   # days past due for each reminder
intake:
  mail_lookback_hours: 24
budgets_usd_month:
  receptionist: 10
  estimator: 40
  bookkeeper: 5
high_stakes: [scope_writing, pricing, large_proposals, lease_reading, weekly_planner]
payables:
  match_tolerance_pct: 0   # how far a bill may exceed its PO before it is a mismatch
