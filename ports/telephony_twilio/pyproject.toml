[project]
name = "biz-port-telephony-twilio"
version = "1.0.0"
description = "Twilio SMS and voice webhooks adapter"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel", "twilio>=9"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_port_telephony_twilio"]
