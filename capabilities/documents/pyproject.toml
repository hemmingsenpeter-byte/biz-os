[project]
name = "biz-cap-documents"
version = "1.0.0"
description = "Templates to PDF, versions, e-signature requests"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel", "jinja2>=3.1", "weasyprint>=62", "pypdf>=4"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_cap_documents"]
