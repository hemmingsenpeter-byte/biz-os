terms:
  base build: The landlord's standard shell and services before tenant works.
  make good: Reinstating premises to the condition the lease requires on exit.
  NLA: Net lettable area in square metres.
  FF&E: Furniture, fixtures and equipment.
  Cat A: Base-build finish with ceilings, lighting and services.
  Cat B: Tenant fit-out on top of a Cat A finish.
  strip-out: Removal of existing fit-out, ceilings and services.
  practical completion: The stage at which works are complete and usable apart from
    minor defects.
  variation: A priced change to the agreed scope.
  provisional sum: An allowance for work that cannot yet be priced.
