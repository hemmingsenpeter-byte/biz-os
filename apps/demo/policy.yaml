# Read by kernel/biz_kernel/policy/engine.py (limits, authority, hard_rules, autonomy)
# and by the budget book (budgets_usd_month).
objective: Answer every service request within a working day, politely and accurately.
notes:
  - Nothing leaves the company without a named approver.
authority:
  default: demo_owner
limits:
  max_amount: { default: 500 }
  max_daily: { default: 2000 }   # running total per local day, every role's money actions
  over_limit: deny
hard_rules:
  deny_tools: []
  deny_decision_types: []
autonomy:            # ladder level per decision type: 1 draft, 2 recommend, 3 act+report, 4 silent
  default: 2
  reply_drafting: 2
  reply_sending: 2
  missed_call_text_back: 3   # fixed template, act and report: this proves the path in the demo
  meeting_offer_sending: 2
  meeting_booking: 2
  invoice_posting: 2          # the owner approves every invoice before it is posted
  bill_posting: 2             # the owner approves every bill before it is posted
  debtor_reminder_sending: 2  # the owner approves every payment reminder
comms:               # deterministic send gate (capabilities/comms)
  banned_phrases: []    # case-insensitive phrases that block a message
  link_domains: []      # allowed link hosts in replies; empty = no links allowed
quoting:
  min_margin_pct: 15
  target_margin_pct: 25
  max_discount_pct: 5
  currency: NZD
invoicing:
  payment_terms_days: 20
  reminder_days: [7, 14, 30]   # days past due for each reminder
  # reminder_template:   # optional wording; fields: {lead} {reference} {amount} {currency} {due} {reminder}
  #   subject: "{lead}: invoice {reference} is overdue"
  #   body: "..."
intake:
  mail_lookback_hours: 24
budgets_usd_month:
  demo_clerk: 10
  receptionist: 5
  estimator: 40
  bookkeeper: 5
high_stakes: []
cash:   # a weekly forecast runs from Monday (local week, limits.day_timezone)
  floor: 0   # escalate to the owner when the forecast goes negative (base currency)
payables:
  match_tolerance_pct: 0   # how far a bill may exceed its PO before it is a mismatch
metrics:   # time saved = tasks completed x baseline minutes, minus review time
  # Invented values for the demo. A real business must time its owner on the work first.
  baseline_minutes:
    default: 12   # minutes the owner took per task, by task kind (default covers the rest)
  review_minutes_per_approval: 2
