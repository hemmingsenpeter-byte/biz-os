[project]
name = "biz-port-sign-docuseal"
version = "1.0.0"
description = "DocuSeal e-signature adapter (unmodified DocuSeal service)"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel", "httpx>=0.27"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_port_sign_docuseal"]
