name: demo
kernel: "1.x"
# Supervised needs the owner's recorded go-ahead. The demo is fictional and every port is a
# fake, so its "pilot exit" is the fake-port acceptance suite, not a real shadow pilot.
execution_mode: supervised
supervised_authorization:
  authorized_by: demo_owner
  authorized_on: "2026-11-21"
  pilot_exit_evidence: "fixture: fake ports only; tests/e2e/test_demo_acceptance.py"
capabilities: [demo_desk, intake, booking, comms, quoting, documents, voice_capture, invoicing, payables, cash]
ports:
  mail: fake_mail
  telephony: fake_telephony
  calendar: fake_calendar
  model_local: fake_model
  model_cloud: fake_model
  storage: fake_storage
  sign: fake_sign
  speech: fake_speech
  accounting: fake_accounting
roles: [demo_clerk, receptionist, estimator, bookkeeper]
industries: [demo_trade]
policy: ./policy.yaml
goals: ./goals.yaml
seed: ./seed/
