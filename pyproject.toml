[project]
name = "biz-os"
version = "0.1.0"
description = "Modular platform for AI-run small businesses"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel", "biz-port-fakes", "biz-cap-demo-desk", "biz-port-model-ollama", "biz-port-model-claude", "biz-port-telephony-twilio", "biz-port-mail-m365", "biz-cap-intake", "biz-cap-booking", "biz-cap-comms", "biz-cap-voice-capture", "biz-cap-documents", "biz-cap-quoting", "biz-port-stt-whisper", "biz-port-sign-docuseal", "biz-port-storage-local", "biz-port-accounting-xero", "biz-cap-invoicing", "biz-cap-payables", "biz-cap-cash"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pgserver>=0.1.4",
    "respx>=0.21",
    "httpx>=0.27",
    "types-PyYAML",
]

[tool.uv]
package = false
constraint-dependencies = ["cryptography<48", "cbor2<6"]
# Intel macOS 12 dev box: never compile native deps from source; pick versions with wheels.
no-build-package = ["cryptography", "cbor2", "pydantic-core", "psycopg-binary", "orjson", "uvloop", "watchfiles", "httptools", "pyyaml", "rpds-py", "greenlet", "sqlalchemy", "markupsafe", "cffi", "numpy"]

[tool.uv.workspace]
members = ["kernel", "ports/*", "capabilities/*"]

[tool.uv.sources]
biz-port-accounting-xero = { workspace = true }
biz-cap-invoicing = { workspace = true }
biz-cap-payables = { workspace = true }
biz-cap-cash = { workspace = true }
biz-cap-voice-capture = { workspace = true }
biz-cap-documents = { workspace = true }
biz-cap-quoting = { workspace = true }
biz-port-stt-whisper = { workspace = true }
biz-port-sign-docuseal = { workspace = true }
biz-port-storage-local = { workspace = true }
biz-kernel = { workspace = true }
biz-port-fakes = { workspace = true }
biz-cap-demo-desk = { workspace = true }
biz-port-model-ollama = { workspace = true }
biz-port-model-claude = { workspace = true }
biz-port-telephony-twilio = { workspace = true }
biz-port-mail-m365 = { workspace = true }
biz-cap-intake = { workspace = true }
biz-cap-booking = { workspace = true }
biz-cap-comms = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "kernel/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
# Two conftest.py files (root, kernel/tests) need package bases to have distinct names.
explicit_package_bases = true
exclude = '(^|/)(\.venv|\.claude|web|node_modules)/'
