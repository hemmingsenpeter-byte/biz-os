# For locally managed tunnels. For a token-managed tunnel, set the same hostname
# and origin in the dashboard. The origin enforces the webhook allowlist locally.
tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json
ingress:
  - hostname: hooks.example.com
    service: http://tunnel-ingress:8081
  - service: http_status:404
