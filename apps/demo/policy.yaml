# Read by kernel/biz_kernel/policy/engine.py (limits, authority, hard_rules, autonomy)
# and by the budget book (budgets_usd_month).
objective: Answer every service request within a working day, politely and accurately.
notes:
  - Nothing leaves the company without a named approver.
authority:
  default: demo_owner
limits:
  max_amount: { default: 500 }
  over_limit: deny
hard_rules:
  deny_tools: []
  deny_decision_types: []
autonomy:            # ladder level per decision type: 1 draft, 2 recommend, 3 act+report, 4 silent
  default: 2
  reply_drafting: 2
  reply_sending: 2
  missed_call_text_back: 3   # fixed template, act and report: this proves the path in the demo
  meeting_offer_sending: 2
  meeting_booking: 2
comms:               # deterministic send gate (capabilities/comms)
  banned_phrases: []    # case-insensitive phrases that block a message
  link_domains: []      # allowed link hosts in replies; empty = no links allowed
quoting:
  min_margin_pct: 15
  target_margin_pct: 25
  max_discount_pct: 5
  currency: NZD
intake:
  mail_lookback_hours: 24
budgets_usd_month:
  demo_clerk: 10
  receptionist: 5
  estimator: 40
high_stakes: []
