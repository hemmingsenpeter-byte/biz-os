[project]
name = "biz-kernel"
version = "1.0.0"
description = "BIZ OS kernel: records, packets, policy, approvals, heartbeats, budgets, workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "dbos>=3.4",
    "jsonschema>=4.23",
    "pyyaml>=6",
    "typer>=0.13",
    "packaging>=24",
    "webauthn>=2.2",
    "itsdangerous>=2.2",
]

[project.scripts]
biz = "biz_kernel.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_kernel"]
