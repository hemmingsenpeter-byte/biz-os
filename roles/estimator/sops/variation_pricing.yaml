name: variation_pricing
trigger: variation.raised
goal_key: quote_turnaround_hours
task: { kind: variation_pricing, title: "Price variation: {{packet.summary}}" }
steps:
  - id: book
    kind: tool
    tool: quoting.price_book_read
    args: {}
  - id: draft
    kind: draft
    prompt: prompts/variation_pricing.md
    decision_type: variation_drafting
    schema:
      type: object
      required: [lines, confidence]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [description, quantity, unit, unit_cost, unit_price]
            properties:
              code: { type: [string, "null"] }
              description: { type: string }
              quantity: { type: number }
              unit: { type: string }
              unit_cost: { type: number }
              unit_price: { type: number }
        unpriced: { type: array, items: { type: string } }
        notes: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
    inputs:
      description: "{{packet.payload.description}}"
      requested_by: "{{packet.payload.requested_by}}"
      price_book: "{{steps.book.output}}"
  - id: price
    kind: tool
    tool: quoting.variation_price
    args:
      job_id: "{{packet.payload.job_id}}"
      description: "{{packet.payload.description}}"
      lines: "{{steps.draft.output.lines}}"
  - id: review
    kind: approve
    when: "{{steps.price.output.margin_ok}} == true"
    approver: owner
    reason: "Approve the variation price before it goes to the customer"
  - id: priced
    kind: publish
    when: "{{steps.price.output.margin_ok}} == true"
    packet: variation.priced
    summary: "Variation priced: {{packet.summary}}"
    payload:
      variation_id: "{{packet.payload.variation_id}}"
      total_minor: "{{steps.price.output.total_price_minor}}"
      currency: "{{steps.price.output.currency}}"
      notes: "{{steps.draft.output.notes}}"
  - id: escalate
    kind: publish
    when: "{{steps.price.output.margin_ok}} == false"
    packet: escalation.raised
    summary: "Variation below margin policy: {{packet.summary}}"
    payload:
      subject: "Variation {{packet.payload.variation_id}} is below margin policy"
      reason: "Margin is {{steps.price.output.margin_pct}} percent; the owner must adjust the price"
      raised_by: estimator
      packet_id: "{{packet.id}}"
  - id: hand_to_owner   # below policy: the task stays open; nothing claims it was priced
    kind: stop
    when: "{{steps.price.output.margin_ok}} == false"
    status: escalated
