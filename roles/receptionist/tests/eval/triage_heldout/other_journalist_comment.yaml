name: other_journalist_comment
tags: [routine]
why: "A reporter asks for a comment: not a customer, a supplier or junk."
system_file: ../../../prompts/triage.md
schema_file: _schema.yaml
untrusted:
  - |-
    {
      "enquiry": {
        "channel": "mail",
        "from": "newsdesk@example.org",
        "subject": "Comment for an article",
        "body": "Hello,\n\nI am a reporter on the local paper, writing a piece about how small firms in the area\nare coping with rising costs. Would the owner be willing to give a short comment by\nphone this week?\n\nHannah Brook"
      }
    }
expected: { category: other }
checks:
  - { type: json_schema }
  - { type: exact, fields: [category] }
