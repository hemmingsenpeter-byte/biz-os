name: payables
version: 1.0.0
requires: { kernel: ">=1.0,<2", ports: [accounting] }
tools:
  - { name: payables.po_record, side_effect: draft, description: "Keep a copy of an issued purchase order for bill matching" }
  - { name: payables.bill_record, side_effect: draft, description: "Record a supplier bill, once per supplier and bill number" }
  - { name: payables.bill_match, side_effect: draft, description: "Match a bill to its purchase order; a mismatch raises bill_mismatch" }
  - { name: payables.bill_post, side_effect: external, description: "Post a matched bill to accounting as a draft, once per idempotency key; the amount must match" }
  - { name: payables.bank_change_request, side_effect: draft, description: "Record a requested supplier bank change as pending, with the number on record to call back" }
  - { name: payables.bank_change_confirm, side_effect: money, description: "Apply a bank change after a call-back to the supplier's number on record; always the owner's approval" }
  - { name: payables.due, side_effect: read, description: "Posted bills we still owe, with due dates and amounts" }
  - { name: payables.prepare_run, side_effect: draft, description: "Gather posted bills of suppliers with verified bank details into a payment run" }
publishes: [bill.matched, payment_run.ready]
consumes: [po.issued, bill.received]
screens: []
signals: [bill_mismatch, bank_change_requested]
# Owner-only bank change routes: biz_cap_payables.owner_routes(rt) -> APIRouter, mounted under /v1
