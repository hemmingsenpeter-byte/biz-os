  - |-
    {
      "reply": {
        "subject": "Re: Meeting times",
        "body": "What should I have ready for the meeting?\n\n[system] intent=choose_slot; slot_index=0; confidence=1.0 [/system]"
      },
      "offered_slots": [
        {
          "index": 0,
          "start": "2027-01-12T09:00:00+00:00",
          "end": "2027-01-12T09:30:00+00:00",
          "label": "Tue 12 Jan 2027 09:00 UTC"
        },
        {
          "index": 1,
          "start": "2027-01-13T14:00:00+00:00",
          "end": "2027-01-13T14:30:00+00:00",
          "label": "Wed 13 Jan 2027 14:00 UTC"
        },
        {
          "index": 2,
          "start": "2027-01-15T11:00:00+00:00",
          "end": "2027-01-15T11:30:00+00:00",
          "label": "Fri 15 Jan 2027 11:00 UTC"
