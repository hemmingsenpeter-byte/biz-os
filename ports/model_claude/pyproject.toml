[project]
name = "biz-port-model-claude"
version = "1.0.0"
description = "Claude API model adapter (tool-use structured output, prompt caching)"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel", "anthropic>=0.40"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_port_model_claude"]
