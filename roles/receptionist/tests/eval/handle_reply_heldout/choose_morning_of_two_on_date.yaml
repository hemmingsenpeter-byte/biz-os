        {
          "index": 1,
          "start": "2027-02-17T16:00:00+00:00",
          "end": "2027-02-17T16:30:00+00:00",
          "label": "Wed 17 Feb 2027 16:00 UTC"
        },
        {
          "index": 2,
          "start": "2027-02-19T13:00:00+00:00",
          "end": "2027-02-19T13:30:00+00:00",
          "label": "Fri 19 Feb 2027 13:00 UTC"
        }
