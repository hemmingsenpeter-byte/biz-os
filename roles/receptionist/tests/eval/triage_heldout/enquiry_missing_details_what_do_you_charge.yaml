name: enquiry_missing_details_what_do_you_charge
tags: [missing_details]
why: "A prospect asks about charges without saying for what."
system_file: ../../../prompts/triage.md
schema_file: _schema.yaml
untrusted:
  - |-
    {
      "enquiry": {
        "channel": "mail",
        "from": "d.fontaine@example.com",
        "subject": "Your rates",
        "body": "Hello, could you tell me roughly what you charge? I could not find anything on your\nwebsite. Thank you. D. Fontaine"
      }
    }
expected: { category: enquiry }
checks:
  - { type: json_schema }
  - { type: exact, fields: [category] }
  - { type: numeric_min, field: confidence, min: 0.6 }
