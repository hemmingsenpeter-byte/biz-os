[project]
name = "biz-cap-payables"
version = "1.0.0"
description = "Bill matching, payment runs, supplier onboarding"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_cap_payables"]
