[project]
name = "biz-port-stt-whisper"
version = "1.0.0"
description = "Speech-to-text via faster-whisper"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel"]
[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_port_stt_whisper"]
