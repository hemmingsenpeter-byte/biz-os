# Receptionist pilot. Quoting provides the commercial fit-out industry's required capability.
name: hive
kernel: "1.x"
execution_mode: shadow
capabilities: [intake, booking, comms, quoting]
ports:
  mail: mail_m365
  telephony: telephony_twilio
  calendar: mail_m365            # one Microsoft 365 adapter serves mail and calendar
  model_local: model_ollama      # live data stays local until the owner opts into a cloud tier
roles: [receptionist]
industries: [commercial_fitout]
policy: ./policy.yaml
goals: ./goals.yaml
seed: ./seed/
