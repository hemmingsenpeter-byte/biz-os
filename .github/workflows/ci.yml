name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for PDF rendering (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -p no:cacheprovider
      - run: uv run biz doctor apps/demo && uv run biz doctor apps/hive
      - name: Receptionist smoke fixture assurance
        run: |
          uv run python -m deploy.scenario_smoke --fixture-only --repetitions 1 \
            --out "$RUNNER_TEMP/biz-fixture-smoke.json"

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: biz-ci
      COMPOSE_FILE: deploy/docker-compose.yml
      POSTGRES_PASSWORD: disposable-ci-postgres
      BIZ_SECRET_KEY: disposable-ci-secret-never-for-production
      BIZ_RP_ID: localhost
      BIZ_ORIGIN: http://localhost:3000
      BIZ_APP_DIR: /app/apps/demo
      DOCUSEAL_SECRET_KEY_BASE: disposable-ci-docuseal-secret
      CLOUDFLARE_TUNNEL_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - name: Provision a private document directory
        run: |
          BIZ_SMOKE_OBJECTS="$RUNNER_TEMP/biz-smoke-objects"
          sudo install -d -m 0700 -o 1000 "$BIZ_SMOKE_OBJECTS"
          echo "BIZ_STORAGE_HOST_ROOT=$BIZ_SMOKE_OBJECTS" >> "$GITHUB_ENV"
      - name: Build and start the demo core
        run: |
          docker compose up --build -d --wait --wait-timeout 120 \
            postgres biz-api biz-worker biz-web caddy tunnel-ingress
      - name: Check the owner console and same-origin API proxy
        run: |
          curl --fail --silent http://localhost:3000/auth/login > /dev/null
          test "$(curl --fail --silent http://localhost:3000/v1/health)" = '{"status":"ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/v1/auth/me)" = '401'
      - name: Check the private owner and public webhook boundaries
        run: |
          test "$(curl --fail --silent --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/v1/health)" = '{"status":"ok"}'
          docker compose exec -T biz-api python - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          origin = "http://tunnel-ingress:8081"
          for path, method, status in (
              ("/v1/health", "GET", 404),
              ("/v1/health", "POST", 404),
              ("/auth/login", "GET", 404),
              ("/webhooks/form", "GET", 404),
              ("/webhooks/form", "POST", 422),
          ):
              request = Request(origin + path, method=method)
              try:
                  with urlopen(request, timeout=5) as response:
                      actual = response.status
              except HTTPError as error:
                  actual = error.code
              assert actual == status, (path, method, status, actual)
          PY
      - name: Wait for the packaged worker to finish startup
        run: |
          worker_id=$(docker compose ps -q biz-worker)
          for attempt in $(seq 1 60); do
            test "$(docker inspect --format '{{.State.Running}} {{.RestartCount}}' "$worker_id")" = "true 0"
            if docker compose logs --no-color biz-worker | grep -F 'worker up: demo,'; then
              exit 0
            fi
            sleep 1
          done
          echo 'Worker did not finish startup within 60 seconds' >&2
          exit 1
      - name: Check packaged compositions
        run: |
          docker compose exec -T biz-api biz doctor apps/demo
          docker compose exec -T biz-api biz doctor apps/hive
      - name: Exercise approval, recovery, replay and PDF rendering with fake ports
        run: |
          docker compose cp deploy/smoke_demo.py biz-api:/tmp/smoke_demo.py
          docker compose exec -T biz-api python /tmp/smoke_demo.py --repo-root /app
          test "$(docker inspect --format '{{.State.Running}} {{.RestartCount}}' "$(docker compose ps -q biz-worker)")" = "true 0"
      - name: Verify document persistence across API replacement
        run: |
          docker compose exec -T biz-api python -c 'from biz_port_storage_local import create; assert create().put(b"synthetic", "smoke.txt", "text/plain").size == 9'
          docker compose up -d --force-recreate --no-deps --wait --wait-timeout 120 biz-api
          for service in biz-api biz-worker; do
            docker compose exec -T "$service" python -c 'from biz_port_storage_local import create; storage = create(); path, = storage.root.glob("*/*.txt"); assert storage.get(path.as_uri()) == b"synthetic"'
          done
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 100
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose --profile public down --volumes --remove-orphans

  upgrade-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain the pinned original release after branch cleanup or squash
        run: git fetch --no-tags origin bdf10e6d8f60c0087ee499e4c647ef25d5642468
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Drain the populated original release, upgrade and recover
        run: uv run python -m deploy.upgrade_drill --out "$RUNNER_TEMP/upgrade-drill.json"
      - name: Upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-drill
          path: ${{ runner.temp }}/upgrade-drill.json
          if-no-files-found: ignore

  restore-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install restic
        working-directory: ${{ runner.temp }}
        run: |
          asset=restic_0.18.1_linux_amd64.bz2
          release=https://github.com/restic/restic/releases/download/v0.18.1
          curl --fail --silent --show-error --location --remote-name "$release/$asset"
          curl --fail --silent --show-error --location --remote-name "$release/SHA256SUMS"
          sha256sum --ignore-missing --strict --check SHA256SUMS
          mkdir -p "$RUNNER_TEMP/biz-tools"
          bunzip2 -c "$asset" > "$RUNNER_TEMP/biz-tools/restic"
          chmod +x "$RUNNER_TEMP/biz-tools/restic"
          echo "$RUNNER_TEMP/biz-tools" >> "$GITHUB_PATH"
      - name: Restore the disposable appliance from encrypted backup
        run: uv run python -m deploy.restore_drill

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: System libraries for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --locked
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web build
      - name: Install the test browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Exercise passkeys and approvals against the real backend
        env:
          CI: "true"
        run: pnpm --dir web test:e2e
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-console-screenshots
          path: web/test-results/**/*.png
          if-no-files-found: ignore
