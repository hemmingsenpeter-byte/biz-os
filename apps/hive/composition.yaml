# M2-M6: HIVE runs the receptionist, estimator and bookkeeper. demo_clerk/demo_desk (the M0 placeholder) are only in apps/demo.
name: hive
kernel: "1.x"
capabilities: [intake, booking, comms, quoting, documents, voice_capture, invoicing, payables, cash]
ports:
  mail: mail_m365
  telephony: telephony_twilio
  calendar: mail_m365            # one Microsoft 365 adapter serves mail and calendar
  model_local: model_ollama      # model chosen by M1 evals on the Mac mini
  model_cloud: model_claude
  storage: storage_local
  sign: sign_docuseal
  speech: stt_whisper
  accounting: accounting_xero    # Xero custom connection; drafts only
roles: [receptionist, estimator, bookkeeper]
industries: [commercial_fitout]
policy: ./policy.yaml
goals: ./goals.yaml
seed: ./seed/
