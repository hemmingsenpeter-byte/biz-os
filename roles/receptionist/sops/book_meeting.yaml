name: book_meeting
trigger: opportunity.qualified
when: "{{packet.payload.source}} in mail,form"
goal_key: enquiry_response_minutes
task: { kind: book_meeting, title: "Offer a meeting: {{packet.summary}}" }
steps:
  - id: read
    kind: tool
    tool: intake.read_enquiry
    args: { enquiry_id: "{{packet.payload.enquiry_id}}" }
  - id: slots
    kind: tool
    tool: booking.offer_slots
    args: { days_ahead: 7, duration_minutes: 30, limit: 3 }
  - id: draft
    kind: draft
    prompt: prompts/book_meeting.md
    decision_type: meeting_offer_drafting
    schema:
      type: object
      required: [subject, body]
      properties: { subject: { type: string }, body: { type: string } }
    inputs: { enquiry: "{{steps.read.output}}", slots: "{{steps.slots.output}}" }
  - id: outbox
    kind: tool
    tool: comms.draft
    args:
      channel: mail
      to: "{{steps.read.output.from}}"
      subject: "{{steps.draft.output.subject}}"
      body: "{{steps.draft.output.body}}"
      party_id: "{{steps.read.output.party_id}}"
      expected_to: "{{steps.read.output.from}}"
  - id: gate
    kind: tool
    tool: comms.queue
    args: { message_id: "{{steps.outbox.output.message_id}}" }
  # A blocked message (unrendered tag, opt-out, bad link...) stops here: nothing is sent and
  # nothing is published as sent.
  - id: send
    kind: tool
    when: "{{steps.gate.output.status}} == queued"
    tool: comms.send
    decision_type: meeting_offer_sending
    args:   # the approver sees exactly what will be sent; comms refuses any mismatch
      message_id: "{{steps.outbox.output.message_id}}"
      to: "{{steps.outbox.output.to}}"
      subject: "{{steps.outbox.output.subject}}"
      body: "{{steps.outbox.output.body}}"
  # TODO(comms milestone): booking.book needs the customer's reply choosing a slot, and nothing
  # reads replies yet. Until then this SOP stops after offering times; it never books slot 0
  # for someone who was not asked. When replies are read, add an owner `approve` step that
  # names the chosen slot, then booking.book and the meeting.booked publish.
  - id: done
    kind: publish
    when: "{{steps.send.output.status}} == sent"   # never claim a send that was blocked
    packet: message.sent
    summary: "Meeting times offered to {{steps.read.output.from}}"
    payload:
      message_id: "{{steps.send.output.message_id}}"
      channel: "{{steps.send.output.channel}}"
      to: "{{steps.read.output.from}}"
      body: "{{steps.send.output.body}}"
