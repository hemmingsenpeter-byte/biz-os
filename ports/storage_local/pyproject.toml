[project]
name = "biz-port-storage-local"
version = "1.0.0"
description = "Local filesystem document storage with content hashes"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_port_storage_local"]
