# BIZ OS on the Mac mini (or any Linux box). Ollama is NOT here: it runs natively on macOS
# and containers reach it at host.docker.internal:11434.
# Usage: cp .env.example .env  (fill in) && docker compose -f deploy/docker-compose.yml up -d

x-biz-env: &biz-env
  BIZ_DATABASE_URL: postgresql+psycopg://biz:${POSTGRES_PASSWORD}@postgres:5432/biz
  BIZ_SECRET_KEY: ${BIZ_SECRET_KEY}
  BIZ_RP_ID: ${BIZ_RP_ID}
  BIZ_ORIGIN: ${BIZ_ORIGIN}
  BIZ_APP: ${BIZ_APP:-/app/apps/demo}
  OLLAMA_HOST: http://host.docker.internal:11434
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

x-biz-service: &biz-service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: *biz-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: biz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: biz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biz -d biz"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"   # local only, for backups and admin over Tailscale/SSH

  biz-api:
    <<: *biz-service
    command: ["uvicorn", "biz_kernel.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "8000"

  biz-worker:
    <<: *biz-service
    # DBOS workflows, SOP runner and schedules. Module lands with the workflows milestone.
    command: ["python", "-m", "biz_kernel.workflows.worker"]

  biz-web:
    # Placeholder until the Next.js app exists (M6/M7). Serves a static notice on :3000.
    image: caddy:2-alpine
    restart: unless-stopped
    command: ["caddy", "respond", "--listen", ":3000", "--body", "BIZ OS web: not built yet", "--status", "200"]
    expose:
      - "3000"

  docuseal:
    image: docuseal/docuseal:latest   # unmodified; pin a tag before production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://biz:${POSTGRES_PASSWORD}@postgres:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE}
      HOST: ${DOCUSEAL_HOST:-sign.localhost}
    volumes:
      - docuseal:/data/docuseal
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BIZ_DOMAIN: ${BIZ_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - biz-api
      - biz-web

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Public webhooks and link pages only. No router ports are opened.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001"   # owner/admin over Tailscale only

  # M4: faster-whisper transcription. Uncomment when the speech capability lands.
  # whisper:
  #   image: fedirz/faster-whisper-server:latest-cpu
  #   restart: unless-stopped
  #   environment:
  #     WHISPER__MODEL: Systran/faster-whisper-small
  #   volumes:
  #     - whisper:/root/.cache/huggingface
  #   expose:
  #     - "8000"

volumes:
  pgdata:
  docuseal:
  caddy_data:
  caddy_config:
  kuma:
  # whisper:
