# BIZ OS on the Mac mini (or any Linux box). Ollama is NOT here: it runs natively on macOS
# and containers reach it at host.docker.internal:11434.
# Usage: cp .env.example .env  (fill in) && docker compose -f deploy/docker-compose.yml up -d

x-biz-env: &biz-env
  BIZ_DATABASE_URL: postgresql+psycopg://biz:${POSTGRES_PASSWORD}@postgres:5432/biz
  BIZ_SECRET_KEY: ${BIZ_SECRET_KEY}
  BIZ_RP_ID: ${BIZ_RP_ID}
  BIZ_ORIGIN: ${BIZ_ORIGIN}
  BIZ_APP_DIR: ${BIZ_APP_DIR:-/app/apps/demo}
  BIZ_REPO_ROOT: /app
  BIZ_TICK_SECONDS: "60"
  BIZ_OLLAMA_URL: ${BIZ_OLLAMA_URL:-http://host.docker.internal:11434}
  BIZ_OLLAMA_MODEL: ${BIZ_OLLAMA_MODEL:-llama3.1:8b}
  BIZ_OLLAMA_EMBED_MODEL: ${BIZ_OLLAMA_EMBED_MODEL:-nomic-embed-text}
  BIZ_STORAGE_ROOT: /var/lib/biz-os/objects
  BIZ_TRUSTED_PROXIES: ${BIZ_TRUSTED_PROXIES:-}
  BIZ_DOCUSEAL_URL: ${BIZ_DOCUSEAL_URL:-http://docuseal:3000}
  BIZ_DOCUSEAL_API_KEY: ${BIZ_DOCUSEAL_API_KEY:-}
  BIZ_DOCUSEAL_TEMPLATE_ID: ${BIZ_DOCUSEAL_TEMPLATE_ID:-}
  BIZ_DOCUSEAL_ALLOW_TEMPLATE_MODE: ${BIZ_DOCUSEAL_ALLOW_TEMPLATE_MODE:-0}
  BIZ_DOCUSEAL_WEBHOOK_SECRET: ${BIZ_DOCUSEAL_WEBHOOK_SECRET:-}
  BIZ_DOCUSEAL_WEBHOOK_HEADER: ${BIZ_DOCUSEAL_WEBHOOK_HEADER:-X-Docuseal-Secret}
  BIZ_M365_TENANT: ${BIZ_M365_TENANT:-}
  BIZ_M365_CLIENT_ID: ${BIZ_M365_CLIENT_ID:-}
  BIZ_M365_SECRET: ${BIZ_M365_SECRET:-}
  BIZ_M365_MAILBOX: ${BIZ_M365_MAILBOX:-}
  BIZ_M365_TZ: ${BIZ_M365_TZ:-}
  BIZ_M365_WORK_START: ${BIZ_M365_WORK_START:-09:00}
  BIZ_M365_WORK_END: ${BIZ_M365_WORK_END:-17:00}
  BIZ_M365_AUTHSERV_ID: ${BIZ_M365_AUTHSERV_ID:-}
  BIZ_TWILIO_SID: ${BIZ_TWILIO_SID:-}
  BIZ_TWILIO_TOKEN: ${BIZ_TWILIO_TOKEN:-}
  BIZ_TWILIO_FROM: ${BIZ_TWILIO_FROM:-}
  BIZ_TWILIO_WEBHOOK_URL: ${BIZ_TWILIO_WEBHOOK_URL:-}
  BIZ_XERO_CLIENT_ID: ${BIZ_XERO_CLIENT_ID:-}
  BIZ_XERO_CLIENT_SECRET: ${BIZ_XERO_CLIENT_SECRET:-}
  BIZ_XERO_TENANT_ID: ${BIZ_XERO_TENANT_ID:-}
  BIZ_XERO_SALES_ACCOUNT: ${BIZ_XERO_SALES_ACCOUNT:-200}
  BIZ_XERO_PURCHASES_ACCOUNT: ${BIZ_XERO_PURCHASES_ACCOUNT:-300}
  BIZ_WHISPER_MODEL: ${BIZ_WHISPER_MODEL:-small}
  BIZ_WHISPER_DEVICE: ${BIZ_WHISPER_DEVICE:-cpu}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  BIZ_CLAUDE_MODEL: ${BIZ_CLAUDE_MODEL:-claude-sonnet-5-5}

x-biz-service: &biz-service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: *biz-env
  volumes:
    - type: bind
      source: ${BIZ_STORAGE_HOST_ROOT:-../var/objects}
      target: /var/lib/biz-os/objects
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    restart: unless-stopped
    environment:
      POSTGRES_USER: biz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: biz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biz -d biz"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"   # local only, for backups and admin over Tailscale/SSH

  biz-api:
    <<: *biz-service
    command: ["uvicorn", "biz_kernel.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "8000"

  biz-worker:
    <<: *biz-service
    # Runs migrations, then DBOS workflows, SOP runner and schedules (heartbeat loop).
    command: ["python", "-m", "biz_kernel.workflows.worker"]

  biz-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      # Read by the server at runtime; browser requests stay on the web origin.
      BIZ_API_URL: http://biz-api:8000
      BIZ_ORIGIN: ${BIZ_ORIGIN}
    depends_on:
      biz-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['/auth/login', '/v1/health'].map(path => fetch('http://127.0.0.1:3000' + path).then(response => { if (!response.ok) throw new Error(String(response.status)); }))).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"   # local demo only; private access uses Caddy/Tailscale

  docuseal:
    image: docuseal/docuseal@sha256:d67335c0cb3142818a39878ab67a0d0af2a653220e2203b042796dd1321a4a9c
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://biz:${POSTGRES_PASSWORD}@postgres:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE}
      HOST: ${DOCUSEAL_HOST:-sign.localhost}
    volumes:
      - docuseal:/data/docuseal
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3002:3000"  # local DocuSeal administration

  caddy:
    image: &caddy-image caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # Tailscale Serve terminates owner HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - biz-api
      - biz-web

  tunnel-ingress:
    image: *caddy-image
    profiles: [public]
    restart: unless-stopped
    volumes:
      - ./PublicCaddyfile:/etc/caddy/Caddyfile:ro
    networks: [default, tunnel]
    depends_on:
      - biz-api

  cloudflared:
    image: cloudflare/cloudflared@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    profiles: [public]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [tunnel]
    depends_on:
      - tunnel-ingress

  uptime-kuma:
    image: louislam/uptime-kuma:1@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
    restart: unless-stopped
    volumes:
      - kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001"   # owner/admin over Tailscale only

networks:
  tunnel:

volumes:
  pgdata:
  docuseal:
  kuma:
