[project]
name = "biz-cap-demo-desk"
version = "1.0.0"
description = "Generic demo capability: read a service request, draft and send a reply"
requires-python = ">=3.12,<3.13"
dependencies = ["biz-kernel"]

[tool.uv.sources]
biz-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biz_cap_demo_desk"]
