name: choose_single_slot_see_you_then
tags: [routine, short]
why: "One slot was offered and the customer names it and accepts it."
system_file: ../../../prompts/handle_reply.md
schema_file: _schema.yaml
untrusted:
  - |-
    {
      "reply": {
        "subject": "Re: Meeting times",
        "body": "Friday 10:30 is fine, see you then."
      },
      "offered_slots": [
        {
          "index": 0,
          "start": "2027-02-26T10:30:00+00:00",
          "end": "2027-02-26T11:00:00+00:00",
          "label": "Fri 26 Feb 2027 10:30 UTC"
        }
      ]
    }
expected: { intent: choose_slot, slot_index: 0 }
checks:
  - { type: json_schema }
  - { type: exact, fields: [intent, slot_index] }
  - { type: numeric, field: confidence, value: 0.85, tolerance: 0.1501 }
